name: ci
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core + pap (correctness, KATs, protocol)
        run: cargo test -p rustguard-core -p rustguard-pap --verbose
      - name: Build with TVLA leaky control gated feature
        run: cargo build -p rustguard-core --features tvla-leaky-control

  firmware-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: cargo check firmware (TM4C)
        working-directory: firmware-tm4c
        run: cargo check --release
      - name: cargo check firmware (STM32 TVLA, safe + leaky)
        working-directory: firmware-stm32-tvla
        run: |
          cargo check --release
          cargo check --release --features leaky

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis deps
        run: pip install -r analysis/requirements.txt
      - name: Unit tests (TVLA t-test, perf parser)
        run: python -m pytest analysis/tests -q
      - name: Pipeline self-test (synthetic, end-to-end)
        run: python analysis/selftest.py
