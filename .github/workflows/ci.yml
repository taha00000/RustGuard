name: ci
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core + pap (correctness, KATs, protocol)
        run: cargo test -p rustguard-core -p rustguard-pap --verbose
      - name: Build with TVLA leaky control gated feature
        run: cargo build -p rustguard-core --features tvla-leaky-control

  firmware-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Probe registry (default, controls, ladder, public-key)
        working-directory: probes
        run: |
          cargo check --release
          cargo check --release --features leaky-control
          cargo check --release --features "leaky-control ladder pubkey"
      - name: TM4C firmware (perf, timing, controls, 80 MHz clock, ladder+pubkey)
        working-directory: firmware-tm4c
        run: |
          cargo check --release
          cargo check --release --features timing
          cargo check --release --features "timing leaky"
          cargo check --release --features "timing leaky clk80"
          cargo check --release --features "timing leaky ladder pubkey"
      - name: STM32F303 firmware (controls, 32/64 MHz clocks, ladder+pubkey)
        working-directory: firmware-stm32-timing
        run: |
          cargo check --release
          cargo check --release --features leaky
          cargo check --release --features "leaky clk32"
          cargo check --release --features "leaky clk64"
          cargo check --release --features "leaky ladder pubkey"
      - name: Public-key image must still fit the TM4C's 256 KB flash
        working-directory: firmware-tm4c
        run: |
          cargo install cargo-binutils --locked || true
          rustup component add llvm-tools-preview
          cargo objcopy --release --features "timing leaky pubkey" -- -O binary fw_pk.bin
          SIZE=$(stat -c %s fw_pk.bin)
          echo "public-key image: $SIZE bytes"
          test "$SIZE" -lt 262144 || { echo "image exceeds flash"; exit 1; }

  host-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Application-class harness cross-compiles for aarch64
        working-directory: pi-runner
        run: |
          cargo check --release --target aarch64-unknown-linux-gnu
          cargo check --release --target aarch64-unknown-linux-gnu --features leaky

  binary-ct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analysis/requirements.txt
      - name: Build ct-probe (thumbv7em) and analyze the compiled binary
        working-directory: ct-probe
        run: cargo build --release
      - name: Binary-level constant-time census (must detect the leaky branch)
        run: |
          LIB=$(find . -path '*thumbv7em*/release/libct_probe.a' | head -1)
          python analysis/ct_binary.py --elf "$LIB" \
            --fig results/figures/ct_binary.png --table results/tables/ct_binary.md

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis deps
        run: pip install -r analysis/requirements.txt
      - name: Unit tests (t-test, census, crate attribution, matrix assembly)
        run: python -m pytest analysis/tests -q
      - name: Pipeline self-test (synthetic, end-to-end)
        run: python analysis/selftest.py
      - name: Committed results must still hold their invariants
        run: python analysis/check_results.py

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kani model-checking (functional correctness + safety)
        uses: model-checking/kani-github-action@v1
        with:
          args: "-p rustguard-core"
