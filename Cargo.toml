[workspace]
resolver = "2"
members = ["rustguard-core", "rustguard-pap"]
# Firmware crates build for embedded targets and are excluded from the host
# workspace (they need thumbv7em-none-eabihf / their own .cargo/config).
# They must be listed in `exclude`, otherwise cargo auto-claims them as
# workspace members (they live under the workspace root) and refuses to build
# them standalone with their own target config.
exclude = ["firmware-tm4c", "firmware-stm32-tvla"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/taha00000/RustGuard"
