[workspace]
resolver = "2"
members = ["rustguard-core", "rustguard-pap"]
# The firmware crate builds for an embedded target and is excluded from the host
# workspace (it needs thumbv7em-none-eabihf / its own .cargo/config). It must be
# listed in `exclude`, otherwise cargo auto-claims it as a workspace member (it
# lives under the workspace root) and refuses to build it standalone.
exclude = ["firmware-tm4c", "ct-probe"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/taha00000/RustGuard"
