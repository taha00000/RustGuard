[package]
name = "firmware-stm32-timing"
version = "0.2.0"
edition = "2021"

# dudect-style timing-leakage harness for the STM32F303 (Cortex-M4), the
# cross-silicon counterpart to firmware-tm4c. Same protocol and measurement; only
# the UART/clock bring-up is STM32-specific. Runs on the STM32F3 Discovery.

[dependencies]
probes = { path = "../probes" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"

[features]
default = []
# Links the variable-time tag check as the timing-leakage positive control.
leaky = ["probes/leaky-control"]
# Clock / flash-latency axis: run identical code at 32 or 64 MHz instead of the
# 8 MHz reset default, which raises flash wait states (to 1 and 2 respectively)
# and brings the prefetch buffer into play.
clk32 = []
clk64 = []
# Calibrated leaks of known size, for measuring this platform's detection floor.
ladder = ["probes/ladder"]
# Public-key primitives (scalar multiplication), where real timing bugs live.
pubkey = ["probes/pubkey"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

