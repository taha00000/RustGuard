[package]
name = "firmware-tm4c"
version = "0.2.0"
edition = "2021"

[dependencies]
rustguard-core = { path = "../rustguard-core" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"

[features]
default = []
# dudect-style timing-leakage harness instead of the perf benchmark.
timing = []
# Links the variable-time tag check as the timing-leakage positive control.
# Only meaningful together with `timing`.
leaky = ["rustguard-core/tvla-leaky-control"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
