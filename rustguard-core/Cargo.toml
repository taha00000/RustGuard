[package]
name = "rustguard-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Memory-safe no_std ASCON-128 AEAD + ASCON-HASH (NIST IR 8454)."

[dependencies]
subtle = { version = "2.5", default-features = false }
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }

[features]
default = []
# Compiles an intentionally variable-time tag check used ONLY as a TVLA
# positive control. Never enable in production.
tvla-leaky-control = []
